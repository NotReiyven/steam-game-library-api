<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a24">
  <meta name="description" content="Backlog Compass — your Steam library, organised around what you want to play next.">
  <title>Backlog Compass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot-screen">
      <div class="brand-mark brand-mark--large"><span class="brand-mark__glyph">B</span></div>
      <div class="boot-title">BACKLOG COMPASS</div>
      <div class="boot-copy">Starting your library…</div>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
